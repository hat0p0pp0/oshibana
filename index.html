<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="自分の型を知って、推し仲間と学び直すプラットフォーム（モック）">
<meta name="theme-color" content="#F4F5FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12131D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="オシバナ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>オシバナ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F5FA;--sheet:#FFFFFF;--ink:#191B2E;--ink2:#62657A;--line:#E3E4EE;--chip:#EEEFF6;--shu:#3D5AFE;--ha:#FF3D7F;--ri:#0DAA7B;--yell:#F59E0B;--shu-t:rgba(61,90,254,.16);--ha-t:rgba(255,61,127,.12);--ri-t:rgba(13,170,123,.14);--seed:#9A6B45;--shadow:#191B2E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#12131D;--sheet:#1C1E2B;--ink:#F3F3FA;--ink2:#A3A6BA;--line:#2F3244;--chip:#262939;--shu:#8093FF;--ha:#FF6FA0;--ri:#3DD6A3;--yell:#FFBF4D;--shu-t:rgba(128,147,255,.2);--ha-t:rgba(255,111,160,.15);--ri-t:rgba(61,214,163,.16);--seed:#C99A72;--shadow:#000;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#12131D;--sheet:#1C1E2B;--ink:#F3F3FA;--ink2:#A3A6BA;--line:#2F3244;--chip:#262939;--shu:#8093FF;--ha:#FF6FA0;--ri:#3DD6A3;--yell:#FFBF4D;--shu-t:rgba(128,147,255,.2);--ha-t:rgba(255,111,160,.15);--ri-t:rgba(61,214,163,.16);--seed:#C99A72;--shadow:#000;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);padding-bottom:110px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);display:flex;align-items:center;gap:8px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:6px;font-weight:800;font-size:20px;letter-spacing:.02em;white-space:nowrap}
.brand svg{width:26px;height:26px}
.top-r{margin-left:auto;display:flex;gap:6px;align-items:center}
.top select{font-size:12px;border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 10px;max-width:104px;font-weight:700}
.mode{font-size:12px;border:2px solid var(--ink);background:var(--yell);color:#191B2E;border-radius:999px;padding:5px 11px;font-weight:800;box-shadow:2px 2px 0 var(--shadow);white-space:nowrap}
.icon{border:0;background:var(--sheet);width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;color:var(--ink);display:grid;place-items:center;padding:0 0 3px;border:1.5px solid var(--line)}
.tabs{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;z-index:30;background:var(--sheet);border:2px solid var(--ink);border-radius:24px;box-shadow:3px 3px 0 var(--shadow);display:grid;grid-template-columns:repeat(5,1fr);padding:6px}
.tabs button{border:0;background:none;padding:6px 0;font-size:10.5px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:16px;font-weight:700}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ha);background:var(--ha-t)}
main{padding:0 0 8px}
.pad{padding:0 16px}
h1,h2,h3{font-weight:800;line-height:1.35;margin:0}
h1{font-size:26px;margin:8px 16px 6px}
h2{font-size:18px;margin:26px 16px 10px}
h3{font-size:16px;margin:0 0 6px}
p{margin:0 0 8px}
.lead{color:var(--ink2);margin:0 16px 12px;font-size:14px}
.sheet{background:var(--sheet);border:1.5px solid var(--line);border-radius:22px;padding:18px;margin:10px 16px}
.pop{border:2px solid var(--ink);box-shadow:4px 4px 0 var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--ink2);font-size:13px}
.small{font-size:12px}
.btn{border:2px solid var(--ink);border-radius:999px;padding:12px 20px;background:var(--ink);color:var(--paper);font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:3px 3px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.full{width:100%}
.btn.big{padding:16px 22px;font-size:17px}
.btn.ha{background:var(--ha);color:#fff}
.btn.ri{background:var(--ri);color:#fff}
.btn.ghost{background:var(--sheet);color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:13px;box-shadow:2px 2px 0 var(--shadow)}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.stack>*+*{margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);transition:transform .08s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.on::before{content:'✓ '}
.chip.shu.on{background:var(--shu);border-color:var(--shu);color:#fff}
.chip.ha.on{background:var(--ha);border-color:var(--ha);color:#fff}
.chip.ri.on{background:var(--ri);border-color:var(--ri);color:#fff}
.chip.shu.on::before,.chip.ha.on::before,.chip.ri.on::before{content:''}
.tag{display:inline-block;font-size:11px;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--ink2);white-space:nowrap;font-weight:700}
.tag.ha{background:var(--ha-t);color:var(--ha)}
.tag.shu{background:var(--shu-t);color:var(--shu)}
.tag.ri{background:var(--ri-t);color:var(--ri)}
.tag.yell{background:rgba(245,158,11,.16);color:var(--yell)}
.seg{display:flex;margin:6px 16px 4px;gap:6px;overflow-x:auto;padding:2px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:7px 10px;font-size:13px;white-space:nowrap;color:var(--ink2);font-weight:700}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.flower{display:block;margin:0 auto;max-width:100%;height:auto}
.flower .lbl{font-size:11px;fill:var(--ink2);font-family:inherit;font-weight:700}
.flower .side{font-size:13px;font-weight:800;fill:var(--ink)}
.flower .guide{fill:none;stroke:var(--line);stroke-width:1}
.flower .guide.mid{stroke-dasharray:3 4}
.p-shu{fill:var(--shu-t);stroke:var(--shu);stroke-width:1.8;stroke-linejoin:round}
.p-ha{fill:var(--ha-t);stroke:var(--ha);stroke-width:1.6;stroke-dasharray:5 3}
.p-ri{fill:none;stroke:var(--ri);stroke-width:2.4;stroke-linejoin:round}
.p-fr{fill:none;stroke:var(--ha);stroke-width:2}
.ri-band{fill:var(--ri-t);opacity:.6}
.bloom .p-shu,.bloom .p-ha{transform-box:view-box;transform-origin:0 0;animation:bloom .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes bloom{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.legend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:6px 0 0;font-weight:700}
.legend i{display:inline-block;width:14px;height:10px;border-radius:5px;margin-right:4px;vertical-align:middle}
.meter{height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.meter>span{display:block;height:100%;background:var(--shu);border-radius:4px}
.meter.ha>span{background:var(--ha)}
.meter.ri>span{background:var(--ri)}
.meter.yell>span{background:var(--yell)}
.axis{padding:14px 0;border-top:1.5px dashed var(--line)}
.axis:first-child{border-top:0;padding-top:0}
.axis .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);font-weight:700}
.track{position:relative;height:22px;margin:4px 0}
.track .base{position:absolute;left:0;right:0;top:10px;height:3px;background:var(--line);border-radius:2px}
.track .band{position:absolute;top:4px;height:14px;background:var(--ri-t);border-radius:7px}
.track .arrow{position:absolute;top:10px;height:3px;background:var(--ha)}
.track .goal{position:absolute;top:0;width:6px;height:22px;margin-left:-3px;border-radius:3px;background:var(--ri)}
.track .dot{position:absolute;top:3px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--shu);border:3px solid var(--sheet);box-shadow:0 0 0 1.5px var(--shu)}
.track .dot.fr{background:var(--ha);box-shadow:0 0 0 1.5px var(--ha)}
.track-key{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink2);font-weight:700;margin-bottom:10px}
.track-key i{display:inline-block;vertical-align:middle;margin-right:4px}
input[type=range]{width:100%;accent-color:var(--ri)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 16px}
.pair .sheet{margin:0}
.card-shu{background:linear-gradient(var(--shu-t),var(--shu-t)),var(--sheet);border-color:transparent}
.card-ha{background:linear-gradient(var(--ha-t),var(--ha-t)),var(--sheet);border-color:transparent}
.card-ri{background:linear-gradient(var(--ri-t),var(--ri-t)),var(--sheet);border-color:transparent}
.card-shu h3{color:var(--shu)}.card-ha h3{color:var(--ha)}.card-ri h3{color:var(--ri)}
.kv{list-style:none;padding:0;margin:0}
.kv li{padding:7px 0;border-top:1.5px dashed var(--line);font-size:14px}
.kv li:first-child{border-top:0}
.kv b{display:block;font-size:11px;color:var(--ink2);font-weight:700}
.hist{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.hist figure{margin:0;text-align:center;min-width:92px}
.hist figcaption{font-size:11px;color:var(--ink2);font-weight:700}
.srl{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:4px;margin:6px 16px 4px}
.srl>i{font-style:normal;color:var(--ink2);font-weight:800}
.srl-i{border-radius:18px;padding:10px 6px;text-align:center;color:#fff;display:flex;flex-direction:column;line-height:1.3}
.srl-i b{font-size:24px;font-weight:800}
.srl-i span{font-size:12px;font-weight:800}
.srl-i small{font-size:10px;opacity:.9}
.srl-i.shu{background:var(--shu)}.srl-i.ha{background:var(--ha)}.srl-i.ri{background:var(--ri)}
.qdots{display:flex;gap:6px;justify-content:center;margin:4px 16px 0;flex-wrap:wrap}
.qdots button{width:22px;height:8px;border-radius:4px;border:0;background:var(--line);padding:0}
.qdots button.done{background:var(--ri)}
.qdots button.cur{background:var(--ink);width:32px}
.qcard{text-align:center;padding:26px 18px}
.qtext{font-size:19px;font-weight:800;line-height:1.55;margin:12px 0 22px;min-height:88px;display:flex;align-items:center;justify-content:center}
.scale{display:flex;justify-content:space-between;align-items:center;gap:4px}
.scale button{border:2.5px solid var(--line);background:var(--sheet);border-radius:50%;padding:0;transition:transform .1s;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.scale button:active{transform:scale(.9)}
.scale button.l{border-color:var(--shu)}
.scale button.r{border-color:var(--ha)}
.scale button.on{background:var(--ink);border-color:var(--ink)}
.scale button.l.on{background:var(--shu);border-color:var(--shu)}
.scale button.r.on{background:var(--ha);border-color:var(--ha)}
.scale-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:8px;font-weight:700}
.opt{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1.5px dashed var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.opt:first-of-type{border-top:0}
.opt .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px}
.opt.on .box{background:var(--ha);border-color:var(--ha);color:#fff}
.opt .grow{flex:1}
.bar{height:6px;background:var(--chip);border-radius:3px;margin-top:5px}
.bar span{display:block;height:100%;background:var(--ha);border-radius:3px}
.mandala{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 16px}
.mandala .qd{border-radius:22px;padding:14px;font-size:13px;min-height:130px}
.mandala .qd b{display:block;font-size:13px;margin-bottom:4px;font-weight:800}
.mandala .q1{background:var(--shu-t);padding-right:46px;padding-bottom:40px}
.mandala .q2{background:var(--ri-t);padding-left:46px;padding-bottom:40px;text-align:right}
.mandala .q3{background:rgba(245,158,11,.16);padding-right:46px;padding-top:40px}
.mandala .q4{background:var(--ha-t);padding-left:46px;padding-top:40px;text-align:right}
.mandala .q1 b{color:var(--shu)}.mandala .q2 b{color:var(--ri)}.mandala .q3 b{color:var(--yell)}.mandala .q4 b{color:var(--ha)}
.mandala .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;text-align:center;font-weight:800;font-size:14px;line-height:1.3;padding:8px;border:5px solid var(--paper)}
.list-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1.5px dashed var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.list-item:first-child{border-top:0}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
img.av{object-fit:cover;background:var(--chip);border:2px solid var(--sheet);box-shadow:0 0 0 1.5px var(--line)}
.photo-edit{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.photo-edit label{cursor:pointer}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:6px;margin:8px 0;align-items:center}
.dots i{width:24px;height:24px;border-radius:50%;border:2px dashed var(--line)}
.dots i.on{background:var(--ha);border:2px solid var(--ink)}
.price{width:100%;border-collapse:collapse;font-size:13px}
.price td{padding:6px 0;border-top:1.5px dashed var(--line)}
.price td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.price tr.now td{font-weight:800;color:var(--ha)}
.price tr.total td{border-top:2px solid var(--ink);font-weight:800;font-size:15px}
.callout{background:var(--ha-t);padding:10px 14px;border-radius:14px;font-size:14px;margin:10px 0;font-weight:700}
.callout.ri{background:var(--ri-t)}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;font-size:34px;line-height:1;color:var(--line);padding:0 2px}
.stars button.on{color:var(--yell)}
textarea,input[type=text],input[type=search],select.field,input[type=number]{width:100%;border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;padding:10px 12px}
textarea{min-height:72px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--ink2);margin:10px 0 4px;font-weight:700}
.hero{padding:4px 16px 0;text-align:center}
.hero h1{margin:18px 0 10px;font-size:26px;line-height:1.35}
.hero-card{background:var(--sheet);border-radius:28px;padding:20px 12px 16px;position:relative}
.stickers{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.stk{font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;color:#fff;border:2px solid var(--ink)}
.stk.shu{background:var(--shu);transform:rotate(-4deg)}.stk.ha{background:var(--ha);transform:rotate(3deg)}.stk.ri{background:var(--ri);transform:rotate(-2deg)}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;padding:10px 0;border-top:1.5px dashed var(--line);align-items:flex-start}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);font-weight:800;font-size:15px;background:var(--ha);color:#fff;width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 16px}
.tile{background:var(--sheet);border:1.5px solid var(--line);border-radius:20px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center}
.tile b{font-size:22px;font-weight:800;line-height:1.2}
.tile span{font-size:11px;color:var(--ink2);font-weight:700}
.tile:active{transform:scale(.96)}
.bignum{font-size:34px;font-weight:800;line-height:1.1}
.bignum small{font-size:15px}
.mission{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1.5px dashed var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.mission:first-child{border-top:0}
.mission .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
.mission.done .ck{background:var(--ri);border-color:var(--ri)}
.mission.done .grow{text-decoration:line-through;color:var(--ink2)}
.bookrow{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--chip);border-radius:14px}
.icon-x{border:0;background:var(--sheet);width:26px;height:26px;border-radius:50%;flex:none;color:var(--ink2);font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:13px;z-index:50;max-width:90%;text-align:center;font-weight:700;animation:pop .25s ease both}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.modal{position:fixed;inset:0;background:rgba(18,19,29,.55);z-index:60;display:grid;place-items:center;padding:20px}
.modal .sheet{max-width:340px;width:100%;text-align:center;margin:0}
.grow-anim{animation:growup 1.2s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 100%}
@keyframes growup{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.qr{display:grid;grid-template-columns:repeat(11,1fr);width:132px;height:132px;margin:10px auto;gap:1px}
.qr i{background:var(--ink);border-radius:1px}
.qr i.o{background:transparent}
.tbl-wrap{overflow-x:auto}
.post{padding:12px 0;border-top:1.5px dashed var(--line)}
.post:first-child{border-top:0}
.odai{background:var(--ha);color:#fff;border-radius:22px;padding:16px 18px;margin:10px 16px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--shadow)}
.odai b{font-size:17px;display:block;margin-top:2px;font-weight:800}
.lecmode{background:var(--yell);color:#191B2E;font-weight:800}

.hscroll{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 10px;scroll-snap-type:x mandatory;scroll-padding-inline:16px}
.hscroll>*{scroll-snap-align:start;flex:none}
.profile{margin:8px 16px 10px;border-radius:26px;padding:18px;background:var(--sheet);position:relative;overflow:hidden}
.profile::before{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:var(--ha-t)}
.profile::after{content:'';position:absolute;right:40px;top:70px;width:70px;height:70px;border-radius:50%;background:var(--shu-t)}

function compute(u){const q=qScores(u),t=toolScores(u),b=bookScores(u);const src=[[q,50],[t,25],[b,25]].filter(x=>x[0]);if(!src.length)return null;const tw=src.reduce((s,x)=>s+x[1],0);const s={};AX.forEach(a=>{s[a.id]=Math.round(src.reduce((acc,x)=>acc+x[0][a.id]*x[1],0)/tw)});

V.dq=()=>{const u=me();const i=clamp(state.ui.qi||0,0,11),q=Q[i];const n=u.answers.filter(v=>v).length;const labels=['全くそう思わない','そう思わない','あまりそう思わない','どちらでもない','ややそう思う','そう思う','とてもそう思う'];
 return`<h1>クイック診断</h1><p class="lead">直感でタップしてください。正解はありません。</p><div class="qdots">${Q.map((_,k)=>`<button class="${k===i?'cur':''} ${u.answers[k]?'done':''}" data-act="qNav:${k}" aria-label="質問${k+1}へ"></button>`).join('')}</div>

V.dtools=()=>{const u=me();const on=u.toolOn||[];return`<h1>自己分析ツールの結果</h1><p class="lead">受けたことのあるツールを選び、結果を入力してください。</p>

 <div class="sheet"><h3>ツールを選ぶ</h3><div class="chips">${TOOLS.map(t=>`<button class="chip ${on.includes(t.id)?'on':''}" data-act="toolOn:${t.id}">${esc(t.name)}<span class="small">（${t.cost}）</span></button>`).join('')}</div></div>

 <div class="pad"><button class="btn full" data-act="back">保存して戻る</button></div>`};
function toolForm(u,t){const v=u.tools[t.id];
 if(t.kind==='multi'){const sel=v||[];return`<div class="small muted" style="margin-bottom:6px">${sel.length}/${t.max}選択中</div><div class="chips">${t.opts.map(o=>`<button class="chip ${sel.includes(o)?'on':''}" data-act="toolPick:${t.id}:${o}">${esc(o)}</button>`).join('')}</div>`}
 if(t.kind==='type'){const s=v||'____';const pairs=[['E','I'],['S','N'],['T','F'],['J','P']];return pairs.map((p,i)=>`<div class="row" style="margin:6px 0"><span class="small muted" style="width:64px">${['外向/内向','感覚/直観','思考/感情','判断/知覚'][i]}</span>${p.map(ch=>`<button class="chip ${s[i]===ch?'on':''}" data-act="toolType:${t.id}:${i}:${ch}">${ch}</button>`).join('')}</div>`).join('')+`<div class="small">現在のタイプ：<b>${esc(v||'未選択')}</b></div>`}
 if(t.kind==='big5'){const b=v||{};return BIG5.map(([k,n])=>`<div class="row" style="margin:6px 0"><span class="small muted" style="width:64px">${n}</span>${[['low','低'],['mid','中'],['high','高']].map(([lv,l])=>`<button class="chip ${b[k]===lv?'on':''}" data-act="toolBig:${k}:${lv}">${l}</button>`).join('')}</div>`).join('')}
 if(t.kind==='one'){return`<div class="chips">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="chip ${v===n?'on':''}" data-act="toolOne:${t.id}:${n}">タイプ${n}</button>`).join('')}</div>`}return''}

 <div class="sheet"><div class="row between"><h3 style="margin:0">✨ 最近の体験・習慣</h3><span class="tag ha">${u.exps.length}個選択中</span></div>${EXP_CATS.map(c=>`<div class="small" style="font-weight:800;margin:14px 0 6px">${c.icon} ${c.name}</div><div class="chips">${EXPS.filter(x=>x.c===c.id).map(x=>`<button class="chip ${u.exps.includes(x.id)?'on':''}" data-act="exp:${x.id}">${esc(x.n)}</button>`).join('')}</div>`).join('')}</div>

V.shuhari=()=>{const u=me(),r=compute(u);if(!r)return V.welcome();const sh=state.ui.show,pl=plan(u,r.s),top=pl.map(p=>p.ax.id);const bloom=state.ui.bloom;state.ui.bloom=false;const rc=reach(u,r.s);
 const bars=AX.map(a=>{const s=r.s[a.id],t=u.target[a.id],lo=clamp(t-15,0,100),hi=clamp(t+15,0,100),isTop=top.includes(a.id),gap=Math.abs(s-t),inb=gap<=15;const from=Math.min(s,t),w=gap;
  return`<div class="axis"><div class="row between"><b style="font-size:14px">${a.name}</b>${inb?'<span class="tag ri">ゴール圏内 ✓</span>':`<span class="tag ${isTop?'ha':''}">目標まであと${gap-15}${isTop?'・伸ばしどころ':''}</span>`}</div><div class="ends"><span>${a.w}</span><span>${a.e}</span></div><div class="track"><div class="base"></div><div class="band" style="left:${lo}%;width:${hi-lo}%"></div>${!inb?`<div class="arrow" style="left:${from}%;width:${w}%"></div>`:''}<div class="goal" style="left:${t}%" title="目標 ${t}"></div><div class="dot" style="left:${s}%" title="いま ${s}"></div></div><label class="small muted" style="display:flex;gap:8px;align-items:center;font-weight:700"><span style="white-space:nowrap">目標を動かす</span><input type="range" min="0" max="100" value="${t}" data-chg="target:${a.id}" aria-label="${a.name}の目標"></label></div>`}).join('');
 const past=(u.hist||[]).map(h=>({d:h.d,s:pastScores(r.s,h.k)}));past.push({d:'いま',s:r.s});
 return`<h1>診断結果</h1><p class="lead">いまの私を知り、反対側を伸ばして、両方を使える私へ。</p>
 <div class="srl"><button class="srl-i shu" data-act="solo:shu" style="border:0"><b>1</b><span>いまの私</span><small>これまでの型</small></button><i>→</i><button class="srl-i ha" data-act="solo:ha" style="border:0"><b>2</b><span>伸ばす方向</span><small>反対側の型</small></button><i>→</i><button class="srl-i ri" data-act="solo:ri" style="border:0"><b>3</b><span>目指す私</span><small>両方を使える</small></button></div>
 <div class="tiles"><div class="tile"><b>${rc}%</b><span>目指す私への到達度</span></div><div class="tile"><b>${inBand(u,r.s)}/6</b><span>ゴール圏内の軸</span></div><div class="tile"><b>${r.conf}%</b><span>診断の確からしさ</span></div></div>
 <div class="sheet pop"><div class="chips" style="justify-content:center;margin-bottom:6px"><button class="chip shu ${sh.shu?'on':''}" data-act="show:shu">いまの私</button><button class="chip ha ${sh.ha?'on':''}" data-act="show:ha">伸ばす方向</button><button class="chip ri ${sh.ri?'on':''}" data-act="show:ri">目指す私</button></div>${flower(r.s,{show:sh,target:u.target,bloom,size:400})}
 <div class="legend"><span><i style="background:var(--shu)"></i>いまの私</span><span><i style="border:2px dashed var(--ha)"></i>伸ばす方向</span><span><i style="border:2.5px solid var(--ri)"></i>目指す私</span></div>
 <div class="callout ri" style="margin-top:12px">緑の線が「目指す私」のかたちです。はじめは全ての軸が真ん中（西洋も東洋も使える状態）に設定されています。青い花びらが緑の線に近づくほど、目指す私に近づいています。</div></div>

V.comm=()=>{const u=me(),r=compute(u);const my=u.themes;const lecSet=new Set();my.forEach(id=>LECS.filter(l=>l.themes.includes(id)).forEach(l=>lecSet.add(l.id)));const totalM=my.reduce((x,id)=>x+memberCount(id),0);const openEv=state.events.filter(e=>my.includes(e.theme)&&(e.status==='voting'||e.status==='proposed')).length;

 const rec=r?candidates(u,r.s).filter(t=>!my.includes(t.id)).slice(0,6):[];
 const card=id=>{const t=TH(id),a=AXM[t.ax];const lecs=LECS.filter(l=>l.themes.includes(id));const ms=members(id).slice(0,5);const evs=state.events.filter(e=>e.theme===id&&e.status!=='done');const best=lecs.map(l=>({l,it:interest(l.id+'|'+id)})).sort((x,y)=>y.it.n-x.it.n)[0];

  <div class="tstats"><div><b>${memberCount(id)}</b><span>仲間</span></div><div><b>${lecs.length}</b><span>推し講師</span></div><div><b>${evs.length}</b><span>開催予定</span></div></div>
  <div class="row between"><div><div class="small muted" style="font-weight:700">推し講師</div><div class="stackav">${lecs.map(l=>avatar(l.name,34,'l:'+l.id)).join('')}</div></div><div style="text-align:right"><div class="small muted" style="font-weight:700">仲間</div><div class="stackav" style="justify-content:flex-end">${ms.map(m=>avatar(m.name,30)).join('')}<span class="tag" style="margin-left:4px;border:0!important">+${memberCount(id)-5}</span></div></div></div>

  <div class="small muted" style="margin-top:10px;font-weight:700">今週のお題：「${esc(t.name)}」を感じた瞬間を、写真か一言で</div>

 return`<h1>推しコミュ</h1><p class="lead">同じテーマを推す仲間と講師が集まる場所です。</p>

function genPosts(t){const m=members(t.id);const ls=LECS.filter(x=>x.themes.includes(t.id));const l=ls[0],l2=ls[1]||ls[0];const r=rng(hash(t.id+'posts'));
 const pool=[
 `通勤路の植え込みを5分だけ眺めてみた。「${t.name}」って、こういう小さな時間から始まるのかもしれない。`,
 l?`${l.name}さんのサークルに参加表明しました。あと少しで投票が始まりそう。`:'このテーマの講師、誰か来てほしいな。',
 `テーマカードにあった「${t.J}」、週末に調べてみます。`,
 `今週のおすすめ体験「${t.ex}」をやってみた。思ったより難しいけど楽しい。`,
 `会議で「${t.re.replace(/力$|感覚$/,'')}」を意識したら、いつもと違う意見が出てきた。`,
 `「${t.un.replace('、という思い込み','')}」って、自分のことだと気づいてちょっと笑った。`,
 l2?`${l2.name}さんの話、録画でもいいから見たい。次の会、日程合うといいな。`:'次の会、日程合うといいな。',
 `同じテーマを推してる人が${memberCount(t.id)}人もいるの心強い。`,
 `${t.W}と${t.E}が同じことを言ってる気がする。東西で表現が違うだけ？`];
 const times=['12分前','1時間前','3時間前','5時間前','昨日','昨日','2日前','3日前'];
 const idx=[...pool.keys()].sort(()=>r()-.5).slice(0,6);
 return idx.map((k,i)=>({name:m[i].name,text:pool[k],time:times[i],yell:Math.floor(r()*40)}))}
V.community=p=>{const t=TH(p.id),u=me(),r=compute(u);const seg=state.ui.comSeg;const lecs=LECS.filter(l=>l.themes.includes(t.id));

 if(seg==='nakama'){const ms=members(t.id);const withD=r?ms.map(m=>({...m,d:Math.sqrt(AX.reduce((x,a)=>x+(m.s[a.id]-r.s[a.id])**2,0)/6)})).sort((a,b)=>a.d-b.d):ms.map(m=>({...m,d:0}));
  const row=m=>`<div class="list-item">${flower(m.s,{labels:false,size:40})}<div class="grow"><b>${esc(m.name)}</b><div class="small muted">型の近さ ${Math.max(5,Math.round(100-m.d*1.4))}%</div></div><button class="btn ghost sm" data-act="go:yell:peer:${m.name}">エール</button></div>`;
  body=`<h2 style="font-size:16px">同志：タイプが近い仲間</h2><p class="lead">同じ場所から、同じ方向を目指しています。</p><div class="sheet">${withD.slice(0,5).map(row).join('')}</div><h2 style="font-size:16px">補い合う仲間：タイプが違う仲間</h2><p class="lead">あなたの伸ばしどころを、すでに持っているかもしれません。</p><div class="sheet">${withD.slice(-5).reverse().map(row).join('')}</div><div class="pad"><button class="btn ghost full" data-act="invite">友達をこのテーマに招待する</button></div>`}
 if(seg==='circle'){const props=state.events.filter(e=>e.theme===t.id&&(e.status==='proposed'||e.status==='voting'));body=`<p class="lead">推しサークルは「講師×テーマ」の小さな場です。参加表明が5人集まると、開催の投票が始まります。</p><div class="sheet">${lecs.length?lecs.map(l=>{const it=interest(l.id+'|'+t.id);return`<button class="list-item" data-act="go:circle:${l.id}:${t.id}">${avatar(l.name,44,'l:'+l.id)}<div class="grow"><b>${esc(l.name)}のサークル</b><div class="small muted">${CAT_ICON[l.cat]} ${esc(l.title)}</div><div class="dots" style="margin:4px 0 0">${[0,1,2,3,4].map(i=>`<i class="${i<Math.min(5,it.n)?'on':''}" style="width:14px;height:14px"></i>`).join('')}<span class="small muted">${Math.min(it.n,5)}/5</span></div></div><span class="muted">›</span></button>`}).join(''):'<p class="small muted">講師を募集中です。</p>'}</div>${props.length?`<h2 style="font-size:16px">開催中の投票・講師からの提案</h2><div class="sheet">${props.map(eventCard).join('')}</div>`:''}`}
 return`<p class="lead" style="margin-top:16px">推しコミュ</p><h1 style="margin-top:0">${esc(t.name)}</h1><p class="lead">仲間 ${memberCount(t.id)}人・講師 ${lecs.length}人</p><div class="seg">${[['timeline','タイムライン'],['nakama','仲間'],['circle','推しサークル']].map(([k,l])=>`<button class="${seg===k?'on':''}" data-act="comSeg:${k}">${l}</button>`).join('')}</div>${body}`};

V.circle=p=>{const l=LEC(p.lec),t=TH(p.theme),u=me(),r=compute(u);const key=l.id+'|'+t.id,it=interest(key);const done=it.by[state.persona];const evc=state.events.find(e=>e.circle===key);const props=state.events.filter(e=>e.lec===l.id&&e.status==='proposed');const st=stageOf(lecYell(l));

 ${props.length?`<h2>講師からの提案</h2><div class="sheet">${props.map(eventCard).join('')}</div>`:''}
 <div class="sheet row">${stageIcon(st,44)}<div class="grow"><b>受け取ったエール ${lecYell(l).toLocaleString()}pt</b><div class="small muted">講師の花：${RANKS[st].n}</div></div><button class="btn sm" data-act="go:yell:lec:${l.id}">エールを送る</button></div>`};

V.events=()=>{const u=me(),seg=state.ui.evSeg;const mine=myEvents();const td=todos();const upcoming=mine.filter(e=>e.status!=='done').map(e=>({e,dt:evDate(e)})).filter(x=>x.dt&&x.dt.days>=0).sort((a,b)=>a.dt.ts-b.dt.ts);const nx=upcoming[0];
 const saved=mine.filter(e=>e.status==='confirmed'||e.status==='done').reduce((x,e)=>x+Math.max(0,perPerson(e,e.min,e.venueFee||0,u).total-perPerson(e,e.joined,e.venueFee||0,u).total),0);
 const cm=state.ui.calM||10,first=new Date(2026,cm-1,1).getDay(),days=new Date(2026,cm,0).getDate();const byDay={};state.events.forEach(e=>{const d=evDate(e);if(d&&d.m===cm)(byDay[d.d]=byDay[d.d]||[]).push(e)});const sel=state.ui.calDay;
 let cal='';['日','月','火','水','木','金','土'].forEach(w=>cal+=`<span class="wd">${w}</span>`);for(let i=0;i<first;i++)cal+='<span></span>';for(let d=1;d<=days;d++){const es=byDay[d]||[];const my=es.some(e=>e.by&&e.by[state.persona]);cal+=`<button class="${es.length?'has':''} ${my?'mine':''} ${sel===d?'sel':''}" data-act="calDay:${d}" ${es.length?'':'tabindex="-1"'} aria-label="${cm}月${d}日 ${es.length}件">${d}${es.length?'<i></i>':'<i style="background:transparent"></i>'}</button>`}
 const listSrc=sel?(byDay[sel]||[]):state.events.filter(e=>e.status===seg);const list=[...listSrc].sort((a,b)=>((evDate(a)||{}).ts||0)-((evDate(b)||{}).ts||0));
 return`<h1>イベント</h1><p class="lead">参加予定の会と、これから始まる会をまとめて確認できます。</p>
 ${nx?`<button class="nexthero" data-act="go:${nx.e.status==='voting'?'vote':'event'}:${nx.e.id}"><div class="row between"><span class="tag">${nx.e.status==='voting'?'日程投票中':'次の予定'}</span><span class="tag">${evFormat(nx.e)==='オンライン'?'💻 オンライン':'📍 対面'}</span></div><div class="row" style="align-items:flex-end;gap:10px;margin-top:10px"><div class="cd">${nx.dt.days===0?'今日':`あと${nx.dt.days}<small>日</small>`}</div><div class="small" style="font-weight:700;padding-bottom:4px">${nx.dt.m}月${nx.dt.d}日（${esc(nx.dt.w)}）${esc(nx.dt.time)}</div></div><b style="display:block;font-size:18px;margin:10px 0 6px;line-height:1.4">${esc(nx.e.title)}</b><div class="row small" style="gap:6px;font-weight:700">${avatar(LEC(nx.e.lec).name,26,'l:'+nx.e.lec)}${esc(LEC(nx.e.lec).name)}・${nx.e.joined}人参加</div></button>`:''}
 <div class="tiles" style="grid-template-columns:repeat(4,1fr)"><div class="tile"><b>${upcoming.length}</b><span>参加予定</span></div><div class="tile" style="${td.length?'border-color:var(--ha);':''}"><b style="${td.length?'color:var(--ha)':''}">${td.length}</b><span>要対応</span></div><div class="tile"><b>${mine.filter(e=>e.status==='done').length}</b><span>参加済み</span></div><div class="tile"><b style="font-size:17px">${Math.round(saved).toLocaleString()}</b><span>節約できた円</span></div></div>
 ${td.length?`<h2>やることリスト</h2><div class="sheet">${td.map(x=>`<button class="todo" data-act="${x.act}"><span class="ic" style="background:${x.bg}">${x.ic}</span><span class="grow"><b style="display:block">${x.t}</b><span class="small muted ellipsis" style="display:block">${esc(x.e.title)}</span></span><span class="muted">›</span></button>`).join('')}</div>`:''}
 <h2>カレンダー</h2><div class="sheet"><div class="row between" style="margin-bottom:8px"><button class="icon" data-act="calM:${cm-1}" ${cm<=9?'disabled':''} aria-label="前の月">‹</button><b style="font-size:17px">2026年${cm}月</b><button class="icon" data-act="calM:${cm+1}" ${cm>=11?'disabled':''} aria-label="次の月">›</button></div><div class="cal">${cal}</div><div class="row small muted" style="gap:12px;margin-top:8px;font-weight:700"><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ha)"></i> 参加中</span><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink2)"></i> ほかの会</span></div></div>
 <h2>${sel?`${cm}月${sel}日の会 <button class="btn sm ghost" style="margin-left:6px" data-act="calDay:0">解除</button>`:'すべての会'}</h2>${sel?'':`<div class="seg">${[['voting','投票中'],['proposed','募集中'],['confirmed','開催確定'],['done','開催済み']].map(([k,l])=>`<button class="${seg===k?'on':''}" data-act="evSeg:${k}">${l}（${state.events.filter(e=>e.status===k).length}）</button>`).join('')}</div>`}<div class="sheet">${list.length?list.map(eventCard).join(''):'<p class="small muted">該当する会はありません。</p>'}</div>`};

function priceTable(e,venueFee){const u=me();const rows=[];for(let n=e.min;n<=e.max;n++){const p=perPerson(e,n,venueFee,u);rows.push(`<tr class="${n===e.joined?'now':''}"><td>${n}人${n===e.joined?'（いま）':''}</td><td>${yen(p.total)}</td></tr>`)}return`<div class="tbl-wrap"><table class="price">${rows.join('')}</table></div>`}
function breakdown(e,n,venueFee){const u=me(),p=perPerson(e,n,venueFee,u);return`<table class="price"><tr><td>講師料（${yen(e.fee)}÷${n}人）</td><td>${yen(p.lec)}</td></tr><tr><td>会場費（${yen(venueFee)}÷${n}人${tier(u)===2?'、10%還元':''}）</td><td>${yen(p.ven)}</td></tr><tr><td>利用料${u.plus?'（推しプラスで無料）':tier(u)?`（評価割引${[0,20,50][tier(u)]}%）`:''}</td><td>${yen(p.pf)}</td></tr><tr class="total"><td>1人あたり</td><td>${yen(p.total)}</td></tr></table>`}
V.vote=p=>{const e=ev(p.id),t=TH(e.theme),l=LEC(e.lec);const mv=e.voted[state.persona];const sel=state.ui.vote[e.id]||(mv?{...mv}:{});state.ui.vote[e.id]=sel;
 const lead=k=>[...e.opts[k]].sort((a,b)=>b.v-a.v)[0];const venue=e.opts.venue.find(v=>v.id===sel.venue)||lead('venue');
 const nNext=Math.min(e.joined+3,e.max);const now=perPerson(e,e.joined,venue.fee,me()).total,nxt=perPerson(e,nNext,venue.fee,me()).total;
 const cat=(k,label)=>{const tot=e.opts[k].reduce((s,o)=>s+o.v,0);return`<div class="sheet"><h3>${label}</h3>${e.opts[k].map(o=>`<button class="opt ${sel[k]===o.id?'on':''}" data-act="voteSel:${e.id}:${k}:${o.id}" ${mv?'disabled':''}><span class="box">${sel[k]===o.id?'✓':''}</span><span class="grow">${esc(o.l)}${o.fee!==undefined?`<span class="small muted">　会場費 ${o.fee?yen(o.fee):'なし'}</span>`:''}<div class="bar"><span style="width:${tot?o.v/tot*100:0}%"></span></div></span><span class="small muted">${o.v}票</span></button>`).join('')}</div>`};
 return`<p class="lead" style="margin-top:16px">${esc(t.name)}・${esc(l.name)}</p><h1 style="margin-top:0">${esc(e.title)}</h1><div class="sheet row between"><div><b>${e.joined}人</b><span class="small muted">／最大${e.max}人が参加表明</span></div><span class="tag ha">締め切り${e.deadline}</span></div>
 <div class="sheet"><h3>参加費の目安</h3><p class="small muted">「${esc(venue.l)}」の場合。人数が増えるほど1人あたりが安くなります。</p>${e.joined<e.max?`<div class="callout">あと${nNext-e.joined}人集まると、1人あたり<b>${yen(now-nxt)}</b>安くなります</div>`:''}${priceTable(e,venue.fee)}<button class="btn ghost sm" style="margin-top:10px" data-act="inviteEv:${e.id}">友達を誘う</button></div>
 ${cat('date','日時')}${cat('format','形式')}${cat('venue','場所')}
 <div class="pad">${mv?'<div class="callout ri">投票済みです。締め切り後、講師が承認すると開催が確定します。</div>':`<button class="btn ha full" data-act="vote:${e.id}" ${sel.date&&sel.format&&sel.venue?'':'disabled'}>この内容で投票する</button><p class="small muted" style="text-align:center;margin-top:8px">締め切り後、最多得票の組み合わせを講師が承認して確定します</p>`}</div>`};

V.event=p=>{const e=ev(p.id),t=TH(e.theme),l=LEC(e.lec),u=me(),per=state.persona;const head=`<p class="lead" style="margin-top:16px">${esc(t.name)}・${esc(l.name)}</p><h1 style="margin-top:0">${esc(e.title)}</h1><div class="sheet"><ul class="kv"><li><b>日時</b>${esc(e.date)}</li><li><b>形式</b>${esc(e.format)}</li><li><b>場所</b>${esc(e.venue)}</li><li><b>参加者</b>${e.joined}人（最少${e.min}人・最大${e.max}人）</li></ul></div>`;
 if(e.status==='proposed'){const j=e.by[per];return head+`<div class="sheet"><h3>参加費の目安（いまの人数）</h3>${breakdown(e,Math.max(e.joined,e.min),e.venueFee)}<div class="callout">あと${Math.max(0,e.min-e.joined)}人集まると開催が決まります</div></div><div class="pad"><button class="btn ha full" data-act="joinProp:${e.id}" ${j?'disabled':''}>${j?'参加表明済み':'この会に参加する'}</button></div>`}
 if(e.status==='confirmed'){const paid=e.paid&&e.paid[per],ci=e.checked&&e.checked[per];return head+`<div class="sheet"><h3>参加費</h3>${breakdown(e,e.joined,e.venueFee)}<p class="small muted" style="margin-top:6px">キャンセルは開催3日前まで無料です（モックの想定）。</p></div>`+(paid?`<div class="sheet" style="text-align:center"><h3>チケット</h3>${qrSvg(e.id+per)}<p class="small muted">当日、会場でこのコードを見せてください</p>${ci?'<div class="callout ri">チェックイン済みです</div>':`<button class="btn sm" data-act="checkin:${e.id}">チェックインする（デモ）</button>`}</div><div class="pad"><button class="btn ghost full" data-act="finish:${e.id}">イベントを終える（デモ）</button></div>`:`<div class="pad"><button class="btn ha full" data-act="pay:${e.id}">事前決済する（デモ）</button><p class="small muted" style="text-align:center;margin-top:8px">実際の決済は行われません</p></div>`)}
 const rated=e.rated&&e.rated[per];return head+`<div class="sheet">${rated?'<div class="callout ri">評価を送りました。講師からの評価がそろうと、お互いに公開されます。</div>':'<p>おつかれさまでした。72時間以内に評価をお願いします。</p>'}</div><div class="pad stack">${rated?'':`<button class="btn ha full" data-act="go:rate:${e.id}">評価する</button>`}<button class="btn ghost full" data-act="go:yell:lec:${l.id}">${esc(l.name)}さんにエールを送る</button></div>`};

V.rate=p=>{const e=ev(p.id),l=LEC(e.lec);const r=state.ui.rate[e.id]||(state.ui.rate[e.id]={star:0,tags:[]});const TAGS=['学びがあった','問いが深まった','場が温かい','説明がわかりやすい','時間を守っていた','また参加したい'];

 <div class="sheet"><h3>送る量</h3><div class="chips">${amts.map(n=>`<button class="chip ${a===n?'on':''}" data-act="yellAmt:${n}">${n}pt</button>`).join('')}</div><p class="small muted" style="margin-top:8px">残高 ${u.bal.toLocaleString()}pt</p>${st2>st?`<div class="callout ri">このエールで、あなたの花が「${RANKS[st2].n}」に育ちます</div>`:''}</div>

V.mypage=()=>{const u=me(),r=compute(u),ti=tier(u),st=stageOf(u.sent);const rc=r?reach(u,r.s):0;const hm=heatHtml(u);const up=myEvents().filter(e=>e.status!=='done').map(e=>({e,dt:evDate(e)})).filter(x=>x.dt&&x.dt.days>=0).sort((a,b)=>a.dt.ts-b.dt.ts);const pl=r?plan(u,r.s):[];
 const next=[[4.5,5],[4.8,15]][Math.min(ti,1)];const tierPct=ti>=2?100:Math.round((Math.min(u.rc/next[1],1)*.5+Math.min((u.rating||0)/next[0],1)*.5)*100);

 ${photoPicker('u:'+state.persona,'')}
 <div class="pstats"><div><b>${u.rc?'★'+u.rating:'-'}</b><span>評価</span></div><div><b>${u.rc}</b><span>参加した会</span></div><div><b>${u.friends.length}</b><span>フレンド</span></div></div></div>
 <div class="kpis"><button class="kpi" data-act="tab:shuhari"><span class="lbl">目指す私への到達度</span><div class="row" style="gap:8px">${ring(rc,'var(--ri)',64,8,rc+'%')}<span class="small muted">${r?lean(r.s):'診断がまだです'}</span></div></button>
 <div class="kpi dark"><span class="lbl">エール残高</span><span class="num">${u.bal.toLocaleString()}<small>pt</small></span><button class="btn sm" style="background:var(--yell);color:#191B2E;margin-top:auto" data-act="buy">＋ 追加する</button></div>
 <div class="kpi"><span class="lbl">わたしの花</span><div class="row" style="gap:6px">${stageIcon(st,44)}<div><b style="font-size:18px">${RANKS[st].n}</b><div class="small muted">${st<3?`次まで${(RANKS[st+1].min-u.sent).toLocaleString()}pt`:'最高ランク'}</div></div></div><div class="meter yell"><span style="width:${stPct}%"></span></div></div>
 <div class="kpi"><span class="lbl">評価による割引</span><div class="row" style="gap:8px">${ring(tierPct,'var(--ha)',64,8,['通常','20%','50%'][ti])}<span class="small muted">${u.plus?'推しプラスで利用料無料':['割引なし','利用料20%引き','50%引き＋還元'][ti]}</span></div></div></div>
 ${r?`<h2>いまの私と伸ばす方向</h2><div class="sheet row" style="gap:12px">${flower(r.s,{labels:false,size:120,show:{shu:1,ri:1},target:u.target})}<div class="grow"><div class="small muted" style="font-weight:700;margin-bottom:6px">伸ばしどころ</div><div class="chips">${pl.map(p=>`<span class="tag ha">${p.ax.name}→${p.dir==='e'?p.ax.e:p.ax.w}</span>`).join('')}</div><button class="btn sm ghost" style="margin-top:10px" data-act="tab:shuhari">診断結果を見る</button></div></div>`:`<div class="sheet"><p>診断を受けると、ここにあなたのタイプが表示されます。</p><button class="btn sm ha" data-act="go:diag">診断する</button></div>`}
 <h2>学びの記録</h2><div class="sheet"><div class="row between" style="margin-bottom:10px"><div><span class="bignum" style="font-size:28px">${hm.recent}</span><span class="small muted" style="font-weight:700"> 日（直近4週間の活動日）</span></div><span class="tag ri">過去14週</span></div><div class="heat">${hm.cells}</div><div class="row small muted" style="justify-content:flex-end;gap:4px;margin-top:6px;font-weight:700">少ない<i style="width:10px;height:10px;border-radius:3px;background:var(--chip)"></i><i style="width:10px;height:10px;border-radius:3px;background:var(--ri);opacity:.35"></i><i style="width:10px;height:10px;border-radius:3px;background:var(--ri);opacity:.65"></i><i style="width:10px;height:10px;border-radius:3px;background:var(--ri)"></i>多い</div></div>
 <h2>次の予定</h2><div class="sheet">${up.length?up.slice(0,3).map(x=>eventCard(x.e)).join(''):'<p class="small muted">予定はまだありません。推しコミュから気になる会を探してみましょう。</p><button class="btn sm" data-act="tab:comm">推しコミュを見る</button>'}</div>
 <h2>推しテーマ</h2><div class="hscroll">${u.themes.map(id=>{const t=TH(id);return`<button class="ccard" style="width:170px" data-act="go:community:${id}"><span class="tag" style="background:${AXCOL[t.ax]};color:#fff">${AXM[t.ax].name}</span><b style="display:block;margin:6px 0 2px;font-size:16px">${esc(t.name)}</b><span class="small muted">仲間 ${memberCount(id)}人</span></button>`}).join('')}<button class="ccard" style="width:140px;border-style:dashed" data-act="go:pick"><b>＋ テーマを<br>選び直す</b></button></div>

 <h2>割引の段階</h2><div class="sheet"><div class="tierstep"><div class="${ti===0?'on':''}"><b>通常</b>利用料500円</div><div class="${ti===1?'on':''}"><b>20%引き</b>★4.5・5回〜</div><div class="${ti===2?'on':''}"><b>50%引き</b>★4.8・15回〜</div></div><p class="small muted" style="margin-top:8px;font-weight:700">${need}</p></div>
 <div class="sheet ${u.plus?'':'pop'}" style="${u.plus?'':'background:var(--yell);color:#191B2E;border-color:var(--ink)'}"><div class="row between"><div><b style="font-size:17px">推しプラス</b><div class="small" style="opacity:.8;font-weight:700">月額980円</div></div><button class="btn sm ${u.plus?'ghost':''}" data-act="plus">${u.plus?'解約する（デモ）':'加入する（デモ）'}</button></div><div class="small" style="margin-top:8px;font-weight:700">利用料無料・高評価講師に優先参加・投票の先行通知・推しテーマ5つまで</div></div>
 <details class="sheet"><summary>安全とプライバシー</summary><ul class="kv"><li>対面イベントへの参加には本人確認が必要です${u.verified?'':`<br><button class="btn sm" style="margin-top:6px" data-act="verify">本人確認をする（デモ）</button>`}</li><li>ご利用は18歳以上、飲酒を伴う会場は20歳以上が対象です</li><li>講師とのやり取りはアプリ内メッセージに限られます</li><li>気になる相手は、プロフィールから通報・ブロックできます</li><li>はじめての方には、オンライン開催の会を先にご案内します</li></ul></details>
 <details class="sheet"><summary>デモの操作</summary><div class="stack"><button class="btn ghost full" data-act="go:diag">診断をやり直す</button><button class="btn ghost full" data-act="reset">デモの状態をリセットする</button></div></details>`};

V.friend=p=>{const u=me(),f=state.users[p.id],r=compute(u),rf=compute(f);if(!r||!rf)return`<div class="sheet" style="margin-top:16px">比較するには、お互いの診断が必要です。</div>`;const shared=u.themes.filter(x=>f.themes.includes(x));const evs=state.events.filter(e=>(e.status==='proposed'||e.status==='voting')&&(u.themes.includes(e.theme)||f.themes.includes(e.theme)));
 return`<div class="pad row" style="margin-top:10px;gap:0">${avatar(u.name,52,'u:'+state.persona)}<span style="margin-left:-10px">${avatar(f.name,52,'u:'+p.id)}</span></div><h1>${esc(f.name)}さんと比べる</h1><div class="sheet">${flower(r.s,{friend:rf.s,size:400,show:{shu:1}})}<div class="legend"><span><i style="background:var(--shu)"></i>あなた</span><span><i style="border:2px solid var(--ri)"></i>${esc(f.name)}さん</span></div></div>
 <div class="sheet">${AX.map(a=>`<div class="axis"><b style="font-size:14px">${a.name}</b><div class="ends"><span>${a.w}</span><span>${a.e}</span></div><div class="track"><div class="base"></div><div class="dot" style="left:${r.s[a.id]}%"></div><div class="dot fr" style="left:${rf.s[a.id]}%"></div></div></div>`).join('')}</div>

 ${evs.length?`<h2>一緒に参加できそうな会</h2><div class="sheet">${evs.map(eventCard).join('')}</div><div class="pad"><button class="btn ha full" data-act="pair">ペアで参加する（ペア割・各200円引き）</button></div>`:''}`};

V.lec=()=>{const l=LEC(state.lec);const rate=lecRate(l),st=stageOf(lecYell(l));const pend=state.events.filter(e=>e.lec===l.id&&e.status==='voting');const mine=state.events.filter(e=>e.lec===l.id&&e.status!=='voting');const ratings=state.lecRatings[l.id]||[];
 const lead=(e,k)=>[...e.opts[k]].sort((a,b)=>b.v-a.v)[0];
 return`<div class="lecmode" style="padding:10px 18px"><span class="tag yell">講師側の画面（簡易表示）</span></div>
 <div class="sheet"><label class="f" for="lecsel" style="margin-top:0">表示する講師</label><select class="field" id="lecsel" data-chg="lec">${LECS.map(x=>`<option value="${x.id}" ${x.id===l.id?'selected':''}>${esc(x.name)}（${x.cat}）</option>`).join('')}</select></div>
 <div class="sheet"><div class="row">${avatar(l.name,72,'l:'+l.id)}<div class="grow"><h1 style="margin:0;font-size:22px">${esc(l.name)}</h1><div class="small muted">${CAT_ICON[l.cat]} ${l.cat}｜${esc(l.title)}</div></div></div>${photoPicker('l:'+l.id,'講師は顔写真の登録をおすすめします。本人確認の書類と照合し、プロフィールやサークル、イベントに表示されます。')}<div style="text-align:center;margin-top:8px">${flower(l.s,{size:300,show:{shu:1}})}<p class="small muted">講師も診断を受け、自分のタイプを公開します。ユーザーの「伸ばす方向」にタイプがある講師ほどマッチしやすくなります。</p></div></div>
 <h2>成約手数料</h2><div class="sheet"><div class="row between"><span>現在の評価</span><b>★${l.rating}（${l.count}回開催）</b></div><table class="price" style="margin-top:8px"><tr class="${rate===.15?'now':''}"><td>通常</td><td>15%</td></tr><tr class="${rate===.12?'now':''}"><td>★4.5以上・開催10回以上</td><td>12%</td></tr><tr class="${rate===.10?'now':''}"><td>★4.8以上・開催30回以上</td><td>10%＋おすすめ枠</td></tr></table><p class="small muted" style="margin-top:6px">講師料${yen(l.fee)}の場合の受取額：${yen(l.fee*(1-rate))}</p></div>
 <h2>受け取ったエール</h2><div class="sheet row">${stageIcon(st,56)}<div class="grow"><b>${lecYell(l).toLocaleString()}pt・${RANKS[st].n}</b><div class="small muted">エールが多いほど、テーマ内での表示順が上がります</div></div></div>
 <h2>推しサークル</h2><div class="sheet">${l.themes.map(id=>{const it=interest(l.id+'|'+id);return`<div class="list-item"><div class="grow"><b>${esc(TH(id).name)}</b><div class="small muted">参加表明 ${Math.min(it.n,5)}/5人・推しコミュ ${memberCount(id)}人</div></div></div>`}).join('')}</div>
 <h2>承認待ちの投票</h2><div class="sheet">${pend.length?pend.map(e=>`<div class="post"><b>${esc(e.title)}</b><div class="small muted">参加表明 ${e.joined}人・締め切り${e.deadline}</div><ul class="kv" style="margin:6px 0"><li><b>最多の日時</b>${esc(lead(e,'date').l)}</li><li><b>最多の形式</b>${esc(lead(e,'format').l)}</li><li><b>最多の場所</b>${esc(lead(e,'venue').l)}</li></ul><button class="btn ha sm" data-act="approve:${e.id}">締め切って開催を確定する</button></div>`).join(''):'<p class="small muted">承認待ちの投票はありません。</p>'}</div>
 <h2>イベントを提案する</h2><div class="sheet"><label class="f" for="pth">テーマ</label><select class="field" id="pth" data-id="pth">${l.themes.map(id=>`<option value="${id}">${esc(TH(id).name)}</option>`).join('')}</select><label class="f" for="pti">タイトル</label><input type="text" id="pti" data-id="pti" placeholder="例：朝の庭で季節を感じる会"><label class="f" for="pdt">日時</label><input type="text" id="pdt" data-id="pdt" placeholder="例：10月25日（日）10:00〜12:00"><label class="f" for="pfm">形式</label><select class="field" id="pfm" data-id="pfm"><option>対面</option><option>オンライン</option></select><div class="pair" style="margin:0"><div><label class="f" for="pmin">最少人数</label><input type="number" id="pmin" data-id="pmin" value="5" min="3" max="10"></div><div><label class="f" for="pmax">最大人数</label><input type="number" id="pmax" data-id="pmax" value="10" min="5" max="20"></div></div><label class="f" for="pfee">講師料（1回あたり、参加者で割り勘）</label><input type="number" id="pfee" data-id="pfee" value="${l.fee}" step="1000"><button class="btn full" style="margin-top:12px" data-act="propose">提案を公開する</button></div>
 <h2>自分のイベント</h2><div class="sheet">${mine.length?mine.map(e=>`<div class="post"><b>${esc(e.title)}</b><div class="small muted">${({proposed:'募集中',confirmed:'開催確定',done:'開催済み'})[e.status]}・${esc(e.date||'')}・${e.joined}人</div></div>`).join(''):'<p class="small muted">まだありません。</p>'}</div>
 <h2>最近の評価</h2><div class="sheet">${[...ratings,...(()=>{const pool=[{star:5,text:'問いの立て方が変わりました。また参加したいです。'},{star:5,text:'場の空気がやわらかく、初参加でも話しやすかった。'},{star:4,text:'内容は濃かったです。もう少し時間がほしかった。'},{star:5,text:'自分の思い込みに気づけた2時間でした。'},{star:5,text:'仲間と一緒だから続けられそうです。'},{star:4,text:'オンライン参加でしたが一体感がありました。'}];const r=rng(hash(l.id));return pool.sort(()=>r()-.5).slice(0,4)})()].map(x=>`<div class="post"><span style="color:var(--yell)">${'★'.repeat(x.star)}</span><p class="small" style="margin:4px 0 0">${esc(x.text||'（コメントなし）')}</p></div>`).join('')}</div>`};

function render(){save();const n=state.nav;let view=state.mode==='lec'?'lec':n.view;const fn=V[view]||V.home;
 let html=topbar()+`<main>${fn(n.p||{})}</main>`+tabbar();
 if(state.toast)html+=`<div class="toast" role="status">${esc(state.toast)}</div>`;
 if(state.modal)html+=`<div class="modal" role="dialog" aria-modal="true" aria-label="花が育ちました"><div class="sheet">${stageIcon(state.modal.st,110,true)}<h2 style="margin:10px 0 6px;text-align:center">花が「${RANKS[state.modal.st].n}」に育ちました</h2><p class="small muted">新しい特典：${RANKS[state.modal.st].perk}</p><button class="btn full" data-act="closeModal">閉じる</button></div></div>`;
 document.getElementById('app').innerHTML=html;
 if(view==='analyze'&&!render.t){render.t=setTimeout(()=>{render.t=null;state.ui.bloom=true;const u=me();if(state.persona==='new'&&!u.hist.length)u.hist=[];state.stack=[];state.nav={tab:'shuhari',view:'shuhari',p:{}};render();window.scrollTo(0,0)},1700)}}

/* ============ 操作 ============ */
const val=id=>{const el=document.querySelector(`[data-id="${id}"]`);return el?el.value:''};
const ACT={
 back,tab:t=>tab(t),
 go:(view,a,b)=>{const p=view==='circle'?{lec:a,theme:b}:view==='yell'?{kind:a,id:b}:a!==undefined?{id:a}:{};if(view==='community')state.ui.comSeg='timeline';if(view==='pick')state.ui.pick=null;if(view==='dq'){const f=me().answers.findIndex(x=>!x);state.ui.qi=f>=0?f:0}if(view==='circle'){const u=me();u.mis=u.mis||{};u.mis.circle=true}go(view,p)},
 mode:()=>{state.mode=state.mode==='user'?'lec':'user';state.stack=[];if(state.mode==='user')state.nav={tab:'home',view:'home',p:{}};render();window.scrollTo(0,0)},
 ans:(i,v)=>{me().answers[+i]=+v;const u=me();if(+i<11)state.ui.qi=+i+1;else{const f=u.answers.findIndex(x=>!x);if(f>=0)state.ui.qi=f}render()},
 qNav:i=>{state.ui.qi=clamp(+i,0,11);render()},
 solo:k=>{state.ui.show={shu:true,ha:k==='ha',ri:k==='ri'};render()},
 toolOn:id=>{const u=me();u.toolOn=u.toolOn||[];u.toolOn=u.toolOn.includes(id)?u.toolOn.filter(x=>x!==id):[...u.toolOn,id];render()},
 toolPick:(id,o)=>{const u=me(),t=TOOLS.find(x=>x.id===id);let s=u.tools[id]||[];if(s.includes(o))s=s.filter(x=>x!==o);else if(s.length<t.max)s=[...s,o];else{toast(`${t.max}つまで選べます`);return}u.tools[id]=s;render()},
 toolType:(id,i,ch)=>{const u=me();const s=(u.tools[id]||'____').split('');s[+i]=ch;u.tools[id]=s.join('');render()},
 toolBig:(k,lv)=>{const u=me();u.tools.big5={...(u.tools.big5||{}),[k]:lv};render()},
 toolOne:(id,n)=>{me().tools[id]=+n;render()},
 exp:id=>{const u=me();u.exps=u.exps.includes(id)?u.exps.filter(x=>x!==id):[...u.exps,id];render()},
 analyze:()=>{if(!compute(me()))return;go('analyze')},
 show:k=>{state.ui.show[k]=!state.ui.show[k];render()},
 pickT:id=>{const u=me(),max=u.plus?5:3,s=state.ui.pick;if(s.includes(id))state.ui.pick=s.filter(x=>x!==id);else if(s.length<max)s.push(id);else{toast(`推しテーマは${max}つまでです`);return}render()},
 savePick:()=>{me().themes=[...state.ui.pick];state.ui.pick=null;toast('推しテーマを決めました');tab('comm')},
 toggleTheme:id=>{const u=me(),max=u.plus?5:3;if(u.themes.includes(id))u.themes=u.themes.filter(x=>x!==id);else if(u.themes.length<max)u.themes.push(id);else{toast(`推しテーマは${max}つまでです。先にどれかを外してください`);return}toast(u.themes.includes(id)?'推しテーマに追加しました':'推しテーマから外しました')},
 comSeg:k=>{state.ui.comSeg=k;render()},
 evSeg:k=>{state.ui.evSeg=k;render()},
 post:id=>{const txt=val('post').trim();if(!txt){toast('投稿内容を入力してください');return}(state.posts[id]=state.posts[id]||[]).unshift({name:me().name,key:'u:'+state.persona,text:txt,time:'たった今',yell:0});me().bal+=10;me().mis=me().mis||{};me().mis.post=true;toast('投稿しました。エール10ptを受け取りました')},
 interest:(key)=>{const it=interest(key);if(it.by[state.persona])return;it.by[state.persona]=1;it.n++;const [lid,tid]=key.split('|');const u=me();u.bal+=0;
  if(it.n>=5&&!state.events.find(e=>e.circle===key)){const l=LEC(lid),t=TH(tid);const face=l.format.includes('対面');const id='ev'+Date.now();state.events.unshift({id,circle:key,theme:tid,lec:lid,title:`${l.name}と「${t.name}」を学ぶ会`,status:'voting',joined:5,min:5,max:10,fee:l.fee,deadline:'あと48時間',by:{[state.persona]:1},voted:{},opts:{date:[{id:'d1',l:'10月24日（土）14:00〜16:00',v:2},{id:'d2',l:'10月25日（日）10:00〜12:00',v:1},{id:'d3',l:'10月29日（木）19:30〜21:30',v:1}],format:face?[{id:'f1',l:'対面',v:2},{id:'f2',l:'オンライン',v:1}]:[{id:'f2',l:'オンライン',v:3}],venue:face?[{id:'v1',l:`${l.area}のレンタルスペース`,fee:8000,v:2},{id:'v2',l:`${l.area}のカフェ（1ドリンク付き）`,fee:12000,v:1},{id:'v3',l:'オンライン（ビデオ会議）',fee:0,v:1}]:[{id:'v3',l:'オンライン（ビデオ会議）',fee:0,v:4}]}});toast('5人集まりました。開催の投票が始まります')}else toast(`参加表明しました（${Math.min(it.n,5)}/5人）`)},
 voteSel:(id,k,o)=>{state.ui.vote[id]={...(state.ui.vote[id]||{}),[k]:o};render()},
 vote:id=>{const e=ev(id),sel=state.ui.vote[id];['date','format','venue'].forEach(k=>{const o=e.opts[k].find(x=>x.id===sel[k]);if(o)o.v++});e.voted[state.persona]={...sel};e.by[state.persona]=1;toast('投票しました')},
 inviteEv:id=>{const e=ev(id);if(e.joined>=e.max){toast('定員に達しています');return}e.joined++;toast('友達が参加表明しました（デモ）')},
 invite:()=>toast('招待リンクをコピーしました（デモ）'),
 joinProp:id=>{const e=ev(id);if(e.by[state.persona])return;e.by[state.persona]=1;e.joined++;if(e.joined>=e.min){e.status='confirmed';toast('最少人数に達し、開催が確定しました')}else toast(`参加表明しました。あと${e.min-e.joined}人で開催決定です`)},
 pay:id=>{const e=ev(id);e.paid=e.paid||{};e.paid[state.persona]=1;me().bal+=50;toast('決済が完了しました（デモ）。参加でエール50ptを受け取りました')},
 checkin:id=>{const e=ev(id);e.checked=e.checked||{};e.checked[state.persona]=1;toast('チェックインしました')},
 finish:id=>{const e=ev(id);e.status='done';e.rated=e.rated||{};state.stack=[];state.nav={tab:'events',view:'event',p:{id}};toast('イベントが終わりました。評価をお願いします')},
 star:(id,n)=>{state.ui.rate[id].star=+n;render()},
 rtag:(id,x)=>{const r=state.ui.rate[id];r.tags=r.tags.includes(x)?r.tags.filter(y=>y!==x):[...r.tags,x];render()},
 rate:id=>{const e=ev(id),r=state.ui.rate[id];e.rated=e.rated||{};e.rated[state.persona]=1;(state.lecRatings[e.lec]=state.lecRatings[e.lec]||[]).unshift({star:r.star,text:val('rcomment')||r.tags.join('、')});const u=me();u.rc++;state.stack=[];state.nav={tab:'events',view:'event',p:{id}};toast('評価を送りました')},
 yellAmt:n=>{state.ui.yellAmt=+n;render()},
 sendYell:(kind,id)=>{const u=me(),a=state.ui.yellAmt;if(u.bal<a)return;const before=stageOf(u.sent);u.bal-=a;u.sent+=a;if(kind==='lec')state.lecYell[id]=(state.lecYell[id]||0)+a;const after=stageOf(u.sent);u.mis=u.mis||{};u.mis.yell=true;if(after>before)state.modal={st:after};back();toast(`${a}ptのエールを送りました`)},
 buy:()=>{me().bal+=1000;toast('エールを1,000pt追加しました（デモ）')},
 closeModal:()=>{state.modal=null;render()},
 plus:()=>{const u=me();u.plus=!u.plus;if(!u.plus&&u.themes.length>3)u.themes=u.themes.slice(0,3);toast(u.plus?'推しプラスに加入しました（デモ）':'推しプラスを解約しました（デモ）')},
 verify:()=>{me().verified=true;toast('本人確認が完了しました（デモ）')},
 pair:()=>toast('ペア割を適用しました（デモ）'),
 comGo:(id,seg)=>{state.ui.comSeg=seg;go('community',{id})},
 calDay:d=>{state.ui.calDay=(+d&&state.ui.calDay!==+d)?+d:0;render()},
 calM:m=>{state.ui.calM=clamp(+m,9,11);state.ui.calDay=0;render()},
 photoDel:(...k)=>{delete state.photos[k.join(':')];toast('写真を削除しました')},
 reset:()=>{if(confirm('デモの状態を初期に戻しますか？')){state=initState();render();window.scrollTo(0,0)}},
 approve:id=>{const e=ev(id);const lead=k=>[...e.opts[k]].sort((a,b)=>b.v-a.v)[0];const v=lead('venue');e.date=lead('date').l;e.format=lead('format').l;e.venue=v.l;e.venueFee=v.fee;e.status='confirmed';e.paid={};e.checked={};toast('開催が確定し、参加者に通知しました')},
 propose:()=>{const l=LEC(state.lec);const title=val('pti').trim(),date=val('pdt').trim();if(!title||!date){toast('タイトルと日時を入力してください');return}const fmt=val('pfm');const min=clamp(+val('pmin')||5,3,20),max=clamp(+val('pmax')||10,min,30);state.events.unshift({id:'ev'+Date.now(),theme:val('pth'),lec:l.id,title,status:'proposed',joined:0,min,max,fee:+val('pfee')||l.fee,date,format:fmt,venue:fmt==='オンライン'?'オンライン':`${l.area}（提携スペース）`,venueFee:fmt==='オンライン'?0:8000,by:{},paid:{},checked:{}});toast('提案を公開しました。推しサークルに表示されます')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const [fn,...args]=el.dataset.act.split(':');if(ACT[fn]){e.preventDefault();ACT[fn](...args);if(!['back','tab','go','mode','reset','analyze','savePick','comGo'].includes(fn))render()}});
document.addEventListener('change',async e=>{const ph=e.target.closest('[data-photo]');if(ph){const key=ph.dataset.photo,file=ph.files&&ph.files[0];if(!file)return;try{const url=await toThumb(file);const prev=state.photos[key];state.photos[key]=url;if(!save()){if(prev)state.photos[key]=prev;else delete state.photos[key];toast('保存容量がいっぱいです。ほかの写真を削除してからお試しください');return}toast('写真を登録しました')}catch(err){toast('画像ファイル（JPEG・PNGなど）を選んでください')}return}
 const el=e.target.closest('[data-chg]');if(!el)return;const [k,a]=el.dataset.chg.split(':');
 if(k==='persona'){state.persona=el.value;state.stack=[];state.nav={tab:'home',view:'home',p:{}};state.ui.pick=null;state.ui.bloom=true;render();window.scrollTo(0,0)}
 if(k==='target'){me().target[a]=+el.value;render()}
 if(k==='lec'){state.lec=el.value;render();window.scrollTo(0,0)}});
document.addEventListener('input',e=>{const el=e.target.closest('[data-filter="book"]');if(!el)return;const q=el.value.trim();document.querySelectorAll('.book').forEach(b=>{b.style.display=!q||b.dataset.key.includes(q)?'':'none'})});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
</script>
</body>
</html>
